name: 테스트 및 빌드 검증

# 언제 실행되는가:
# - main 브랜치에 push 하거나 그쪽으로 PR을 만들 때 자동 실행
# - GitHub 저장소의 "Actions" 탭에서 "Run workflow" 버튼을 눌러 수동으로도 실행 가능
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 빌드 · 린트 · 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: 패키지 설치 (npm ci)
        run: npm ci

      - name: 타입체크 + 빌드 (tsc -b && vite build)
        run: npm run build

      - name: 린트 (oxlint)
        run: npm run lint

      - name: 단위 테스트 (vitest)
        run: npm test

      - name: api/*.ts 타입 별도 검사
        run: |
          cat > tsconfig.apicheck.json <<'EOF'
          {
            "compilerOptions": {
              "target": "es2023",
              "module": "esnext",
              "moduleResolution": "bundler",
              "esModuleInterop": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["api"]
          }
          EOF
          npx tsc -p tsconfig.apicheck.json
