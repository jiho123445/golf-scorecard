<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프라인 - Happy Golf</title>
    <style>
      body { margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f8fafc; color:#334155; text-align:center; padding:24px; }
      .card { max-width:320px; }
      .emoji { font-size:44px; margin-bottom:12px; }
      h1 { font-size:18px; margin:0 0 8px; color:#0f172a; }
      p { font-size:14px; color:#64748b; line-height:1.5; margin:0; }
      button { margin-top:20px; height:44px; padding:0 20px; border-radius:12px; border:none; background:#14532d; color:#fff; font-weight:700; font-size:14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">📶</div>
      <h1>인터넷 연결이 끊겼습니다</h1>
      <p>이전에 열어본 화면은 계속 볼 수 있지만, 이 화면은 연결이 필요합니다. 연결이 돌아오면 다시 시도해주세요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
